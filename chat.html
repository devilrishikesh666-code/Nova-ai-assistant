<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with Nova | Rishikesh Singh</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="stage" aria-hidden="true"><div class="ring ring-1"></div><div class="ring ring-2"></div><div class="glow"></div><div class="floor"></div></div>

  <nav class="nav">
    <a href="index.html" class="logo"><span class="logo-cube" aria-hidden="true"><span></span><span></span><span></span></span>Nova</a>
    <div class="links"><a href="index.html">Home</a><a href="chat.html">Chat</a><a href="create.html">Create</a><a href="about.html">About</a></div>
  </nav>

  <main class="chat-wrap">
    <p class="eyebrow">Chat</p>
    <h1 style="font-size:2rem;font-weight:900;margin:8px 0 18px">Talk to <span class="grad">Nova</span></h1>

    <div class="card" id="unlockCard">
      <p class="lock">&#128274; Owner access only</p>
      <div class="field">
        <input type="password" id="ownerToken" placeholder="Owner token" aria-label="Owner token" autocomplete="off" />
        <button class="btn btn-primary" id="unlockBtn">Unlock</button>
      </div>
      <p class="note" id="unlockMsg">Enter the owner token to use the AI. The key itself is never sent to this page.</p>
    </div>

    <div class="card chat-box" id="chatBox" hidden>
      <div class="log" id="log" aria-live="polite">
        <div class="msg bot">Hi, I'm Nova. What should we build?</div>
      </div>
      <form class="bar" id="chatForm">
        <input type="text" id="msg" placeholder="Message Nova..." aria-label="Message Nova" maxlength="2000" required />
        <button class="btn btn-primary" id="sendBtn" type="submit">Send</button>
      </form>
    </div>
    <p class="note"><button class="btn btn-ghost btn-small" id="lockBtn" hidden style="min-height:36px;padding:6px 12px">Lock</button></p>
  </main>

  <footer class="footer">&copy; <span id="year"></span> Developed by <strong>Rishikesh Singh</strong></footer>
  <script src="js/main.js"></script>
  <script>
    // PROXY_URL is your deployed Cloudflare Worker (see worker/owner-proxy.js). Set it once below.
    const PROXY_URL = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";
    const log = document.getElementById("log");
    const token = document.getElementById("ownerToken");
    const box = document.getElementById("chatBox");
    const card = document.getElementById("unlockCard");
    const msgInput = document.getElementById("msg");
    const history = [];

    function show(el, text, cls) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function unlock() {
      const t = token.value.trim();
      if (!t) return;
      document.getElementById("unlockMsg").textContent = "Checking...";
      try {
        const r = await fetch(PROXY_URL + "/check", { headers: { Authorization: "Bearer " + t } });
        if (!r.ok) throw new Error();
        sessionStorage.setItem("novaOwner", t);
        enter();
      } catch {
        document.getElementById("unlockMsg").textContent = "Wrong token or server offline.";
      }
    }

    function enter() {
      card.hidden = true;
      box.hidden = false;
      document.getElementById("lockBtn").hidden = false;
      msgInput.focus();
    }

    document.getElementById("unlockBtn").addEventListener("click", unlock);
    token.addEventListener("keydown", (e) => e.key === "Enter" && unlock());
    document.getElementById("lockBtn").addEventListener("click", () => {
      sessionStorage.removeItem("novaOwner");
      location.reload();
    });

    if (sessionStorage.getItem("novaOwner")) enter();

    document.getElementById("chatForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = "";
      show(log, text, "user");
      history.push({ role: "user", content: text });
      document.getElementById("sendBtn").disabled = true;

      try {
        const r = await fetch(PROXY_URL + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionStorage.getItem("novaOwner") },
          body: JSON.stringify({ messages: history.slice(-12) })
        });
        if (r.status === 401) throw new Error("Owner token rejected. Please unlock again.");
        if (!r.ok) throw new Error("The AI service returned an error.");
        const data = await r.json();
        history.push({ role: "assistant", content: data.reply });
        show(log, data.reply, "bot");
      } catch (err) {
        show(log, err.message || "Something went wrong.", "err");
      } finally {
        document.getElementById("sendBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
